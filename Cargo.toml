[package]
name = "bevygame"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["dynamic_linking", "free_camera"] }
# bevy_hanabi = { version = "0.20.0", features = ["3d"] }
bevy_rapier3d = "0.37.0"
bevytiles = { git = "https://github.com/ziv/bevytiles", tag = "v0.2.0" }

[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
